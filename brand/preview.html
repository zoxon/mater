<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mater logo: preview</title><style>
  :root { color-scheme: light dark; --bg:#f4f5f7; --fg:#1b1d24; --card:#fff; --line:#d7dae0; --ground:#0f172a; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14151a; --fg:#e8e9ee; --card:#1d1f27; --line:#33363f; } }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px 16px 64px; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:1180px; margin:0 auto; } h1 { font-size:24px; margin:0 0 4px; }
  h2 { font-size:15px; margin:28px 0 0; font-weight:600; } h3 { font-size:13px; margin:22px 0 0; opacity:.7; font-weight:600; }
  .lead { margin:0 0 12px; opacity:.75; max-width:72ch; } a { color:inherit; }
  .stagenav { position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:10px 0; margin:0 0 14px; background:var(--bg); border-bottom:1px solid var(--line); font-size:13px; }
  .stagenav a { text-decoration:none; padding:3px 10px; border-radius:99px; border:1px solid var(--line); background:var(--card); }
  .stagenav a[aria-current="page"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }
  .row { display:flex; flex-wrap:wrap; gap:16px; margin-top:10px; }
  figure { margin:0; flex:1 1 260px; } figure.wide { flex:1 1 400px; } figcaption { font-size:12px; opacity:.65; margin-top:6px; }
  .stage { border-radius:10px; padding:16px; display:flex; align-items:center; gap:16px; min-height:96px; flex-wrap:wrap; }
  .dark { background:var(--ground); } .lightbg { background:#fff; border:1px solid #d1d9e0; }
  .plain { background:#e9ebef; } @media (prefers-color-scheme: dark) { .plain { background:#262932; } }
  .onwhite { background:#fff; padding:6px 8px; border-radius:6px; display:inline-flex; gap:10px; align-items:center; }
  .avatars { flex-wrap:nowrap; gap:12px; } .avatars svg { display:block; } .round { border-radius:50%; overflow:hidden; display:block; line-height:0; }
  .tabs { background:#cfd3da; flex-direction:column; align-items:stretch; gap:8px; }
  .tab { display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:8px 8px 0 0; width:200px; font-size:13px; }
  .tab.light { background:#fff; color:#1b1d24; } .tab.dark { background:#2b2d35; color:#e8e9ee; } .tab svg { flex:none; }
  .gh.light { background:#fff; color:#1f2328; border:1px solid #d1d9e0; } .gh.dark { background:#0d1117; color:#e6edf3; border:1px solid #30363d; }
  .gh .repo { display:flex; gap:12px; align-items:center; } .gh svg { flex:none; border:1px solid rgba(128,128,128,.35); }
  .gh small, .banner small { display:block; opacity:.7; font-size:12px; }
  .banner { gap:20px; padding:24px; flex-wrap:nowrap; } .banner b { font-size:22px; }
  .banner.dark { color:#f8f8f2; } .banner.lightbg { color:#1f2328; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; margin-top:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; display:grid; gap:10px; align-content:start; }
  .card h2 { font-size:14px; margin:0; font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .id { display:inline-block; min-width:30px; padding:1px 8px; border-radius:6px; background:#0f172a; color:#f1f5f9; font-size:12px; text-align:center; }
  .chip { font-size:11px; padding:1px 7px; border-radius:99px; border:1px solid currentColor; opacity:.8; }
  .note { font-size:12px; opacity:.7; margin:0; } .dropped { opacity:.78; }
  .panel { border-radius:8px; padding:16px; min-height:90px; display:flex; align-items:center; }
  .panel.l { background:#fff; border:1px solid var(--line); color:#0f172a; } .panel.d { background:var(--ground); color:#f1f5f9; }
  .ladder { display:flex; align-items:center; gap:16px; flex-wrap:nowrap; } .ladder.wrap { flex-wrap:wrap; gap:10px 18px; }
  .mk path { fill:currentColor; } .mk, .ladder svg { display:block; }
  .tile { width:60px; height:60px; background:var(--ground); color:#f1f5f9; display:grid; place-items:center; } .tile.round { border-radius:50%; }
  .cell { border-radius:8px; padding:14px; min-height:110px; display:flex; flex-direction:column; justify-content:space-between; gap:10px; }
  .cell.l { background:#fff; border:1px solid var(--line); color:#334155; } .cell.d { background:var(--ground); color:#cbd5e1; }
  .cell small { font-size:12px; } .bad { color:#dc2626; font-weight:700; }
  .opts { display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; margin-top:10px; }
  .stages { list-style:none; margin:14px 0 0; padding:0; display:grid; gap:10px; }
  .stages li { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .stages a { font-weight:600; } .stages .meta { font-size:12px; opacity:.65; }
</style></head>
